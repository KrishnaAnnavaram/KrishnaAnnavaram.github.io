name: Deploy to GitHub Pages

# One pipeline, two jobs. `verify` has to pass before `build` runs, so nothing
# that fails typecheck, lint, unit tests, contrast or E2E can reach Pages.
#
# The E2E suite runs against the real static export rather than a dev server —
# the artefact that ships is the one that gets tested.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Colour contrast (WCAG AA)
        run: node scripts/check-contrast.mjs

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Chromium and WebKit cover the two engines that matter most for this
      # audience; the full five-profile matrix runs locally before a release.
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end and accessibility tests
        run: npx playwright test --project=chromium --project=webkit

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
